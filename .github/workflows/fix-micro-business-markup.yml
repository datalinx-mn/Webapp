name: Fix micro business markup

on:
  push:
    branches:
      - feature/micro-business-simple-mode
    paths:
      - scripts/fix_micro_business_markup.py
      - .github/workflows/fix-micro-business-markup.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/micro-business-simple-mode
      - run: python scripts/fix_micro_business_markup.py
      - name: Validate JavaScript and details tags
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          if html.count('<details') != html.count('</details>'):
            raise SystemExit('Unbalanced details tags')
          Path('/tmp/index-inline.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', html, flags=re.S)), encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix simple mode details markup"
          git push origin HEAD:feature/micro-business-simple-mode
