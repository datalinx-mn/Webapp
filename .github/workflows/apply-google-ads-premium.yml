name: Apply Google Ads and Premium no-ads update

on:
  push:
    branches:
      - feature/google-ads-premium-no-ads
    paths:
      - scripts/apply_google_ads_premium.py
      - .github/workflows/apply-google-ads-premium.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_google_ads_premium.py
      - .github/workflows/apply-google-ads-premium.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/google-ads-premium-no-ads

      - name: Apply code update once
        run: |
          if grep -q "GOOGLE_ADSENSE_CLIENT" index.html && grep -q "PremiumNoAds" Code.gs; then
            echo "Patch already applied"
          else
            python scripts/apply_google_ads_premium.py
          fi

      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit('Duplicate HTML IDs: ' + ', '.join(duplicates))
          required = [
              "GOOGLE_ADSENSE_CLIENT",
              "function isFreePlan()",
              "function renderGoogleAd(",
              "Premium · заргүй",
              "data-ad-placement=\"settings\"",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing expected index.html content: ' + ', '.join(missing))
          PY
          node --check /tmp/index-inline.js

      - name: Validate Apps Script syntax and plan rules
        run: |
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          python - <<'PY'
          from pathlib import Path
          code = Path('Code.gs').read_text(encoding='utf-8')
          required = [
              "company.status === 'Free' ? getActiveAds_() : []",
              "'PremiumNoAds'",
              "companySheet.appendRow([companyName, newSheetId, 'Free'",
              "const premiumStatus = ['active', 'premium', 'идэвхтэй']",
          ]
          missing = [item for item in required if item not in code]
          if missing:
              raise SystemExit('Missing expected Code.gs content: ' + ', '.join(missing))
          PY

      - name: Commit final scripts
        run: |
          if git diff --quiet -- index.html Code.gs GOOGLE_ADS_PREMIUM_SETUP.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Code.gs GOOGLE_ADS_PREMIUM_SETUP.md
          git commit -m "Add Google Ads for Free and remove ads for Premium"
          git push origin HEAD:feature/google-ads-premium-no-ads
