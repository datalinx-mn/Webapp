name: Apply micro business simple mode

on:
  push:
    branches:
      - feature/micro-business-simple-mode
    paths:
      - scripts/apply_micro_business_simple_mode.py
      - .github/workflows/apply-micro-business-simple-mode.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/micro-business-simple-mode

      - name: Apply UI patch
        run: python scripts/apply_micro_business_simple_mode.py

      - name: Validate HTML and embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          required = [
            'quickStartCard', 'todaySalesAmount', 'productManagementCard',
            'visitOperationalDetails', 'visitPaymentDetails', 'visitExceptionDetails'
          ]
          missing = [item for item in required if f'id="{item}"' not in html]
          if missing:
            raise SystemExit(f'Missing required UI IDs: {missing}')
          if html.count('<details') != html.count('</details>'):
            raise SystemExit('Unbalanced details tags')
          PY
          node --check /tmp/index-inline.js

      - name: Commit updated app
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify app for 1-9 employee businesses"
          git push origin HEAD:feature/micro-business-simple-mode
