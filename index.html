<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B5E20">
  <title>DataLinx · Борлуулалт, Агуулах, Түгээлт</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f5f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;color:#1B5E20}.boot-card{display:flex;align-items:center;gap:12px;padding:16px 20px;border:1px solid #dce5dd;border-radius:16px;background:#fff;box-shadow:0 8px 26px rgba(22,48,24,.1);font-weight:800}.boot-spin{width:20px;height:20px;border:3px solid #d7ead9;border-top-color:#1B5E20;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot"><div class="boot-card"><span class="boot-spin"></span><span>DataLinx ачаалж байна...</span></div></div>
  <script>
    (async function loadDataLinx() {
      try {
        const response = await fetch('./app-core.html?v=20260730', { cache: 'no-cache' });
        if (!response.ok) throw new Error('Үндсэн апп ачаалсангүй.');
        let html = await response.text();
        html = html.replace('</head>', '<link rel="stylesheet" href="./premium-ads.css?v=20260730"></head>');
        html = html.replace('</body>', '<script src="./premium-ads.js?v=20260730"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="boot"><div class="boot-card">Апп ачаалж чадсангүй. Интернэт холболтоо шалгаад дахин нээнэ үү.</div></div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
